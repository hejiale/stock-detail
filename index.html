<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>基金持仓收益估算</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #8a8f98;
      --line: #e8ebf0;
      --accent: #1677ff;
      --accent-soft: #e8f1ff;
      --up: #e64545;
      --down: #12a150;
      --shadow: 0 8px 24px rgba(22, 40, 80, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #dbe8ff 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #eef3ff 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      container-type: inline-size;
      container-name: page;
    }

    header {
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    header p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 14px;
    }

    .tabs-arrow {
      flex: 0 0 36px;
      width: 36px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.85);
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: 0.15s ease;
    }

    .tabs-arrow:hover {
      color: var(--accent);
    }

    .tabs-arrow:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .tabs-arrow svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 0;
      flex: 1 1 auto;
      min-width: 0;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 0;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      border: none;
      background: transparent;
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: 0.2s ease;
      flex: 0 0 25%;
      width: 25%;
      min-width: 25%;
      box-sizing: border-box;
      white-space: nowrap;
      text-align: center;
    }

    .tab.active {
      background: var(--card);
      color: var(--accent);
      box-shadow: var(--shadow);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .fund-card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid #eef1f6;
    }

    .fund-meta {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
    }

    .fund-meta .name {
      font-size: 16px;
      font-weight: 700;
    }

    .fund-meta .sub {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .list-head,
    .row {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
    }

    .list-head.view-only,
    .row.view-only {
      grid-template-columns: 1.4fr 1fr;
    }

    .list-head {
      font-size: 12px;
      color: var(--muted);
      background: #fafbfd;
      border-bottom: 1px solid var(--line);
    }

    .row {
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .row[hidden] { display: none; }

    .stock-name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ratio {
      color: #334155;
      font-variant-numeric: tabular-nums;
    }

    .change-field {
      position: relative;
      display: flex;
      align-items: center;
    }

    .row input {
      width: 100%;
      height: 36px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      padding: 0 28px 0 10px;
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      outline: none;
      background: #fff;
      color: #334155;
      transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
    }

    .row input.up { color: var(--up); }
    .row input.down { color: var(--down); }

    .change-icon {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      display: none;
      pointer-events: none;
    }

    .change-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .change-field.up .change-icon.up-icon {
      display: block;
      color: var(--up);
    }

    .change-field.down .change-icon.down-icon {
      display: block;
      color: var(--down);
    }

    .row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }

    .row input::placeholder {
      color: #b4bbc6;
      font-weight: 400;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: #fafbfd;
    }

    .pager-info {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .pager-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pager-btn {
      height: 32px;
      min-width: 32px;
      padding: 0 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .pager-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pager-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, #1677ff, #3b8bff);
      color: #fff;
      box-shadow: 0 10px 20px rgba(22, 119, 255, 0.25);
    }

    .btn-ghost {
      background: #fff;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    .btn-sync {
      background: linear-gradient(135deg, #0f9f6e, #16c784);
      color: #fff;
      box-shadow: 0 10px 20px rgba(15, 159, 110, 0.22);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 50;
      max-width: calc(100% - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .result {
      margin-top: 14px;
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid #eef1f6;
      display: none;
    }

    .result.show { display: block; }

    .result .label {
      font-size: 13px;
      color: var(--muted);
    }

    .result .value {
      margin-top: 6px;
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .result .value.up { color: var(--up); }
    .result .value.down { color: var(--down); }
    .result .value.flat { color: #64748b; }

    .result .detail {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>基金持仓收益估算</h1>
      <p>根据前十大持仓比例，输入各股票当日涨跌幅，估算基金当日收益。</p>
    </header>

    <div class="tabs-bar">
      <button class="tabs-arrow" type="button" data-tab-prev aria-label="上一个">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M10.2 2.6 4.8 8l5.4 5.4 1.2-1.2L7.2 8l4.2-4.2-1.2-1.2z"/>
        </svg>
      </button>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="dongfang" type="button">东方</button>
        <button class="tab" data-tab="caitong" type="button">财通</button>
        <button class="tab" data-tab="huaxia" type="button">华夏</button>
        <button class="tab" data-tab="guangfa" type="button">广发</button>
        <button class="tab" data-tab="jianxin" type="button">建信</button>
        <button class="tab" data-tab="usSemi" type="button">美股</button>
      </div>
      <button class="tabs-arrow" type="button" data-tab-next aria-label="下一个">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M5.8 2.6 4.6 3.8 8.8 8l-4.2 4.2 1.2 1.2L11.2 8 5.8 2.6z"/>
        </svg>
      </button>
    </div>

    <div id="panels"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script>
    const STORAGE_KEY = "fund_daily_returns_v1";
    const PAGE_SIZE = 10;
    const pageState = {};

    function getTotalPages(fund) {
      return Math.max(1, Math.ceil(fund.holdings.length / PAGE_SIZE));
    }

    function getCurrentPage(fundId) {
      return pageState[fundId] || 1;
    }

    function setCurrentPage(fundId, page) {
      const fund = window.FUND_HOLDINGS[fundId];
      const total = getTotalPages(fund);
      pageState[fundId] = Math.min(Math.max(1, page), total);
    }

    function applyPage(fundId) {
      const fund = window.FUND_HOLDINGS[fundId];
      const page = getCurrentPage(fundId);
      const total = getTotalPages(fund);
      const panel = document.querySelector(`[data-panel="${fundId}"]`);
      if (!panel) return;

      panel.querySelectorAll(".row[data-index]").forEach((row) => {
        const index = Number(row.dataset.index);
        const rowPage = Math.floor(index / PAGE_SIZE) + 1;
        row.hidden = rowPage !== page;
      });

      const info = panel.querySelector(".pager-info");
      if (info) {
        const start = (page - 1) * PAGE_SIZE + 1;
        const end = Math.min(page * PAGE_SIZE, fund.holdings.length);
        info.textContent = `第 ${page}/${total} 页 · ${start}-${end} / ${fund.holdings.length}`;
      }

      const prevBtn = panel.querySelector("[data-page-prev]");
      const nextBtn = panel.querySelector("[data-page-next]");
      if (prevBtn) prevBtn.disabled = page <= 1;
      if (nextBtn) nextBtn.disabled = page >= total;

      panel.querySelectorAll("[data-page-num]").forEach((btn) => {
        const n = Number(btn.dataset.pageNum);
        btn.classList.toggle("active", n === page);
      });
    }

    function buildPagerHtml(fund) {
      const total = getTotalPages(fund);
      if (fund.holdings.length <= PAGE_SIZE) {
        return `<div class="pager"><div class="pager-info">共 ${fund.holdings.length} 条</div></div>`;
      }

      const pageBtns = Array.from({ length: total }, (_, i) => {
        const n = i + 1;
        return `<button class="pager-btn" type="button" data-page-num="${n}" data-fund-page="${fund.id}">${n}</button>`;
      }).join("");

      return `
        <div class="pager">
          <div class="pager-info"></div>
          <div class="pager-btns">
            <button class="pager-btn" type="button" data-page-prev="${fund.id}">上一页</button>
            ${pageBtns}
            <button class="pager-btn" type="button" data-page-next="${fund.id}">下一页</button>
          </div>
        </div>
      `;
    }

    function loadInputs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveInputs(all) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    }

    function formatPct(n) {
      const sign = n > 0 ? "+" : "";
      return sign + n.toFixed(2) + "%";
    }

    function applyChangeColor(input) {
      const field = input.closest(".change-field") || input;
      input.classList.remove("up", "down");
      field.classList.remove("up", "down");

      const raw = input.value.trim();
      if (raw === "" || Number.isNaN(Number(raw))) return;
      const n = Number(raw);
      if (n > 0) {
        input.classList.add("up");
        field.classList.add("up");
      } else if (n < 0) {
        input.classList.add("down");
        field.classList.add("down");
      }
    }

    function applyAllChangeColors(fundId) {
      const selector = fundId
        ? `input[data-fund="${fundId}"]`
        : "input[data-fund]";
      document.querySelectorAll(selector).forEach(applyChangeColor);
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function toSinaSymbol(holding) {
      const code = holding.code;
      if (holding.market === 105 || holding.market === 106 || /[A-Za-z]/.test(code)) {
        return "gb_" + code.toLowerCase();
      }
      if (/^(6|9)\d{5}$/.test(code)) return "sh" + code;
      if (/^(0|2|3)\d{5}$/.test(code)) return "sz" + code;
      if (/^(4|8)\d{5}$/.test(code)) return "bj" + code;
      return "sh" + code;
    }

    function toEastSecId(holding) {
      if (holding.market != null) return holding.market + "." + holding.code;
      const code = holding.code;
      if (/^(6|9)\d{5}$/.test(code)) return "1." + code;
      if (/^(0|2|3)\d{5}$/.test(code)) return "0." + code;
      if (/^(4|8)\d{5}$/.test(code)) return "0." + code;
      return "1." + code;
    }

    async function loadEastMoneyQuotes(holdings) {
      const secids = holdings.map(toEastSecId).join(",");
      const url =
        "https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&fields=f12,f14,f2,f3&secids=" +
        encodeURIComponent(secids) +
        "&_=" +
        Date.now();

      const resp = await fetch(url);
      if (!resp.ok) throw new Error("行情接口请求失败");
      const json = await resp.json();
      const list = json?.data?.diff || [];
      const map = {};
      list.forEach((item) => {
        if (!item || item.f12 == null || item.f3 == null || item.f3 === "-") return;
        map[String(item.f12).toUpperCase()] = {
          name: item.f14,
          price: Number(item.f2),
          change: Math.round(Number(item.f3) * 100) / 100
        };
      });
      return map;
    }

    function loadSinaQuotes(holdings) {
      return new Promise((resolve, reject) => {
        const symbols = holdings.map(toSinaSymbol);
        const list = symbols.join(",");
        const script = document.createElement("script");
        script.charset = "gbk";
        script.src = "https://hq.sinajs.cn/list=" + list + "&_=" + Date.now();

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("行情请求超时，请检查网络后重试"));
        }, 10000);

        function cleanup() {
          clearTimeout(timer);
          script.onload = null;
          script.onerror = null;
          script.remove();
        }

        script.onload = () => {
          cleanup();
          const map = {};
          holdings.forEach((h, idx) => {
            const symbol = symbols[idx];
            const raw = window["hq_str_" + symbol];
            if (!raw) return;
            const parts = raw.split(",");
            // A股: name,open,prev,price...  美股 gb_: name,price,...,change%
            let change;
            if (symbol.startsWith("gb_")) {
              const price = Number(parts[1]);
              const pct = Number(parts[2]);
              if (Number.isNaN(pct)) return;
              change = pct;
              map[h.code.toUpperCase()] = {
                name: parts[0],
                price,
                change: Math.round(change * 100) / 100
              };
              return;
            }
            const name = parts[0];
            const prev = Number(parts[2]);
            const price = Number(parts[3]);
            if (!prev || Number.isNaN(prev) || Number.isNaN(price)) return;
            change = ((price - prev) / prev) * 100;
            map[h.code] = {
              name,
              price,
              prev,
              change: Math.round(change * 100) / 100
            };
          });
          resolve(map);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("行情接口加载失败"));
        };

        document.head.appendChild(script);
      });
    }

    async function loadQuotes(holdings) {
      try {
        const map = await loadEastMoneyQuotes(holdings);
        if (Object.keys(map).length) return map;
      } catch (_) {
        // fall through to sina
      }
      return loadSinaQuotes(holdings);
    }

    async function syncFundQuotes(fundId) {
      const fund = window.FUND_HOLDINGS[fundId];
      const btn = document.querySelector(`[data-sync="${fundId}"]`);

      btn.disabled = true;
      btn.textContent = "正在抓取实时行情…";

      try {
        const quotes = await loadQuotes(fund.holdings);
        let ok = 0;
        const failed = [];

        fund.holdings.forEach((h, i) => {
          const quote = quotes[h.code] || quotes[String(h.code).toUpperCase()];
          const input = document.querySelector(`input[data-fund="${fundId}"][data-index="${i}"]`);
          if (!quote || !input || Number.isNaN(quote.change)) {
            failed.push(h.name);
            return;
          }
          input.value = quote.change.toFixed(2);
          applyChangeColor(input);
          ok += 1;
        });

        persistFromDom();

        if (ok === 0) {
          showToast("未获取到行情，请稍后重试");
          return;
        }

        showToast(
          failed.length
            ? `已同步 ${ok} 只，失败：${failed.join("、")}`
            : `已同步 ${ok} 只股票实时涨跌幅`
        );
      } catch (err) {
        showToast(err.message || "同步失败");
      } finally {
        btn.disabled = false;
        btn.textContent = "推送实时涨跌幅";
      }
    }

    function render() {
      const saved = loadInputs();
      const panels = document.getElementById("panels");
      panels.innerHTML = "";

      Object.values(window.FUND_HOLDINGS).forEach((fund, index) => {
        const panel = document.createElement("section");
        panel.className = "panel" + (index === 0 ? " active" : "");
        panel.dataset.panel = fund.id;

        const fundSaved = saved[fund.id] || {};

        const isUS = fund.market === "US" || fund.viewOnly;
        const viewOnly = !!fund.viewOnly;
        const ratioLabel = isUS ? "参考权重" : "持仓比例";
        const metaSub = isUS
          ? `共 ${fund.holdings.length} 只主流半导体 · 仅查看涨跌`
          : `代码 ${fund.fundCode} · 前十大合计 ${fund.top10Total.toFixed(2)}%`;
        const gridClass = viewOnly ? "row view-only" : "row";
        const headClass = viewOnly ? "list-head view-only" : "list-head";

        const actionsHtml = viewOnly
          ? `
          <div class="actions">
            <button class="btn btn-sync" type="button" data-sync="${fund.id}">推送实时涨跌幅</button>
            <button class="btn btn-ghost" type="button" data-clear="${fund.id}">清空输入</button>
          </div>`
          : `
          <div class="actions">
            <button class="btn btn-sync" type="button" data-sync="${fund.id}">推送实时涨跌幅</button>
            <button class="btn btn-primary" type="button" data-calc="${fund.id}">计算每日基金收益</button>
            <button class="btn btn-ghost" type="button" data-clear="${fund.id}">清空输入</button>
          </div>

          <div class="result" id="result-${fund.id}">
            <div class="label">估算当日收益</div>
            <div class="value flat" id="value-${fund.id}">--</div>
            <div class="detail" id="detail-${fund.id}"></div>
          </div>`;

        panel.innerHTML = `
          <div class="fund-card">
            <div class="fund-meta">
              <div class="name">${fund.fundName}</div>
              <div class="sub">${metaSub}</div>
            </div>
            <div class="${headClass}">
              <div>股票名称</div>
              ${viewOnly ? "" : `<div>${ratioLabel}</div>`}
              <div>日涨跌幅%</div>
            </div>
            <div class="list-body">
              ${fund.holdings.map((h, i) => `
                <div class="${gridClass}" data-index="${i}">
                  <div class="stock-name" title="${h.name}（${h.code}）">${h.name}（${h.code}）</div>
                  ${viewOnly ? "" : `<div class="ratio">${h.ratio.toFixed(2)}%</div>`}
                  <div class="change-field">
                    <input
                      type="number"
                      step="0.01"
                      inputmode="decimal"
                      placeholder="如 1.25"
                      data-fund="${fund.id}"
                      data-index="${i}"
                      value="${fundSaved[i] ?? ""}"
                    />
                    <span class="change-icon up-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 3.2 13.2 11H2.8L8 3.2z"/>
                      </svg>
                    </span>
                    <span class="change-icon down-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 12.8 2.8 5h10.4L8 12.8z"/>
                      </svg>
                    </span>
                  </div>
                </div>
              `).join("")}
            </div>
            ${buildPagerHtml(fund)}
          </div>

          ${actionsHtml}
        `;

        panels.appendChild(panel);
        setCurrentPage(fund.id, getCurrentPage(fund.id));
        applyPage(fund.id);
      });

      applyAllChangeColors();
    }

    function persistFromDom() {
      const saved = loadInputs();
      document.querySelectorAll("input[data-fund]").forEach((input) => {
        const fundId = input.dataset.fund;
        const index = input.dataset.index;
        if (!saved[fundId]) saved[fundId] = {};
        saved[fundId][index] = input.value === "" ? "" : input.value;
      });
      saveInputs(saved);
    }

    function calcFund(fundId) {
      const fund = window.FUND_HOLDINGS[fundId];
      if (fund.viewOnly) return;
      const inputs = document.querySelectorAll(`input[data-fund="${fundId}"]`);
      let weighted = 0;
      let filledWeight = 0;
      let filledCount = 0;
      let missing = [];

      fund.holdings.forEach((h, i) => {
        const raw = inputs[i].value.trim();
        if (raw === "" || Number.isNaN(Number(raw))) {
          missing.push(h.name);
          return;
        }
        const change = Number(raw);
        weighted += h.ratio * change;
        filledWeight += h.ratio;
        filledCount += 1;
      });

      const estimate = weighted / 100;
      const resultEl = document.getElementById(`result-${fundId}`);
      const valueEl = document.getElementById(`value-${fundId}`);
      const detailEl = document.getElementById(`detail-${fundId}`);

      resultEl.classList.add("show");
      valueEl.textContent = formatPct(estimate);
      valueEl.className = "value " + (estimate > 0 ? "up" : estimate < 0 ? "down" : "flat");

      const coverLabel = fund.market === "US" ? "等权合计" : "前十大合计";
      const parts = [
        `已填写 ${filledCount}/${fund.holdings.length} 只，覆盖权重 ${filledWeight.toFixed(2)}%（${coverLabel} ${fund.top10Total.toFixed(2)}%）。`
      ];
      if (missing.length) {
        parts.push(`未填写：${missing.join("、")}（按 0 处理）。`);
      }
      detailEl.textContent = parts.join(" ");
      persistFromDom();
    }

    function clearFund(fundId) {
      document.querySelectorAll(`input[data-fund="${fundId}"]`).forEach((input) => {
        input.value = "";
        applyChangeColor(input);
      });
      const resultEl = document.getElementById(`result-${fundId}`);
      if (resultEl) resultEl.classList.remove("show");
      persistFromDom();
    }

    function getTabButtons() {
      return Array.from(document.querySelectorAll(".tabs .tab"));
    }

    function updateTabArrows() {
      const tabs = getTabButtons();
      const index = tabs.findIndex((t) => t.classList.contains("active"));
      const prevBtn = document.querySelector("[data-tab-prev]");
      const nextBtn = document.querySelector("[data-tab-next]");
      if (prevBtn) prevBtn.disabled = index <= 0;
      if (nextBtn) nextBtn.disabled = index < 0 || index >= tabs.length - 1;
    }

    function switchTab(fundId, { forceSync = false } = {}) {
      const tabs = getTabButtons();
      const tab = tabs.find((t) => t.dataset.tab === fundId);
      if (!tab) return;

      const alreadyActive = tab.classList.contains("active");
      tabs.forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      tab.classList.add("active");

      const panel = document.querySelector(`[data-panel="${fundId}"]`);
      if (panel) panel.classList.add("active");

      tab.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      updateTabArrows();

      if (!alreadyActive || forceSync) {
        syncFundQuotes(fundId);
      }
    }

    function shiftTab(step) {
      const tabs = getTabButtons();
      const index = tabs.findIndex((t) => t.classList.contains("active"));
      const next = tabs[index + step];
      if (next) switchTab(next.dataset.tab);
    }

    document.addEventListener("click", (e) => {
      const pagePrev = e.target.closest("[data-page-prev]");
      if (pagePrev) {
        const fundId = pagePrev.dataset.pagePrev;
        setCurrentPage(fundId, getCurrentPage(fundId) - 1);
        applyPage(fundId);
        return;
      }

      const pageNext = e.target.closest("[data-page-next]");
      if (pageNext) {
        const fundId = pageNext.dataset.pageNext;
        setCurrentPage(fundId, getCurrentPage(fundId) + 1);
        applyPage(fundId);
        return;
      }

      const pageNum = e.target.closest("[data-page-num]");
      if (pageNum) {
        const fundId = pageNum.dataset.fundPage;
        setCurrentPage(fundId, Number(pageNum.dataset.pageNum));
        applyPage(fundId);
        return;
      }

      if (e.target.closest("[data-tab-prev]")) {
        shiftTab(-1);
        return;
      }

      if (e.target.closest("[data-tab-next]")) {
        shiftTab(1);
        return;
      }

      const tab = e.target.closest(".tab");
      if (tab) {
        switchTab(tab.dataset.tab);
        return;
      }

      const syncBtn = e.target.closest("[data-sync]");
      if (syncBtn) {
        syncFundQuotes(syncBtn.dataset.sync);
        return;
      }

      const calcBtn = e.target.closest("[data-calc]");
      if (calcBtn) {
        calcFund(calcBtn.dataset.calc);
        return;
      }

      const clearBtn = e.target.closest("[data-clear]");
      if (clearBtn) {
        clearFund(clearBtn.dataset.clear);
      }
    });

    document.addEventListener("input", (e) => {
      if (e.target.matches("input[data-fund]")) {
        applyChangeColor(e.target);
        persistFromDom();
      }
    });

    render();
    updateTabArrows();
  </script>
</body>
</html>
