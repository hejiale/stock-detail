<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>西方财富</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1><img class="title-icon" src="assets/icon_licai.png" alt="" aria-hidden="true" />西方财富</h1>
    </header>

    <div class="tabs-bar">
      <button class="tabs-arrow" type="button" data-tab-prev aria-label="上一个">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M10.2 2.6 4.8 8l5.4 5.4 1.2-1.2L7.2 8l4.2-4.2-1.2-1.2z"/>
        </svg>
      </button>
      <div class="tabs" role="tablist"></div>
      <button class="tabs-arrow" type="button" data-tab-next aria-label="下一个">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M5.8 2.6 4.6 3.8 8.8 8l-4.2 4.2 1.2 1.2L11.2 8 5.8 2.6z"/>
        </svg>
      </button>
    </div>

    <div class="fund-picker" id="fundPicker" hidden role="tablist" aria-label="子页签"></div>

    <div id="panels"></div>
  </div>

  <div id="modals-root"></div>

  <script src="api.js"></script>
  <script src="watchlist-api.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sparkline.js"></script>
  <script src="js/fund-detail.js"></script>
  <script src="tabs/cn.js"></script>
  <script src="tabs/us.js"></script>
  <script src="tabs/hk.js"></script>
  <script src="tabs/jp.js"></script>
  <script src="tabs/kr.js"></script>
  <script src="tabs/metals.js"></script>
  <script src="tabs/bonds.js"></script>
  <script src="tabs/crypto.js"></script>
  <script src="tabs/fund-rank.js"></script>
  <script src="tabs/watch.js"></script>
  <script src="tabs/funds.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
