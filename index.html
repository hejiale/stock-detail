  <script src="data.js"></script>
  <script src="api.js"></script>
  <script>
    const {
      quoteKey,
      loadQuotes,
      loadIntradayTrends,
      loadDailyKlines,
      loadStockProfile,
      loadCnSectorBoards,
      loadCnSectorStocks,
      loadCnIndices,
      loadUsIndices,
      loadUsStockRank,
      calcPeriodReturns,
      sliceKlinesForRange,
      resolveStock
    } = window.MarketAPI;

    const STORAGE_KEY = "fund_daily_returns_v1";
    const CUSTOM_STOCKS_KEY = "custom_semi_stocks_v1";
    const CUSTOMIZABLE_FUNDS = new Set(["cnSemi", "usSemi"]);
    const MAIN_TABS = [
      { id: "cnSemi", name: "A股", icon: "assets/gupiao.png" },
      { id: "usSemi", name: "美股", icon: "assets/gupiao.png" },
      { id: "funds", name: "自选基金", icon: "assets/zixuan_jijin.png", iconClass: "tab-icon-sm" }
    ];
    const WATCH_FUND_IDS = ["dongfang", "caitong", "huaxia", "guangfa", "jianxin", "huabao", "fuguo"];
    const PAGE_SIZE = 10;
    const pageState = {};
    let activeMainTab = "cnSemi";
    let activeWatchFundId = "dongfang";
    const MODAL_IDS = [
      "chartModal",
      "profileModal",
      "boardModal",
      "boardStocksModal",
      "usBoardModal"
    ];

    function loadJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key) || "null") ?? fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    function loadCustomStocks() {
      return loadJson(CUSTOM_STOCKS_KEY, {});
    }

    function saveCustomStocks(all) {
      saveJson(CUSTOM_STOCKS_KEY, all);
    }

    /** 把本地自选插到默认列表前面 */
    function applyCustomHoldings() {
      CUSTOMIZABLE_FUNDS.forEach((fundId) => {
        const fund = window.FUND_HOLDINGS[fundId];
        if (!fund) return;
        if (!fund._defaultHoldings) {
          fund._defaultHoldings = fund.holdings.slice();
        }
        const custom = (loadCustomStocks()[fundId] || []).map((h) => ({
          ...h,
          custom: true
        }));
        fund.holdings = [...custom, ...fund._defaultHoldings];
      });
    }

    function isWatchFund(fundId) {
      return WATCH_FUND_IDS.includes(fundId);
    }

    function getActiveFundId() {
      if (activeMainTab === "funds") return activeWatchFundId;
      return activeMainTab === "usSemi" ? "usSemi" : "cnSemi";
    }

    function rerender(activeFundId) {
      const keep = activeFundId || getActiveFundId();
      applyCustomHoldings();
      renderFundPanel(keep);
      switchTab(keep, { forceSync: true });
    }

    function getTotalPages(fund) {
      return Math.max(1, Math.ceil(fund.holdings.length / PAGE_SIZE));
    }

    function getCurrentPage(fundId) {
      return pageState[fundId] || 1;
    }

    function setCurrentPage(fundId, page) {
      const fund = window.FUND_HOLDINGS[fundId];
      const total = getTotalPages(fund);
      pageState[fundId] = Math.min(Math.max(1, page), total);
    }

    /** 当前页持仓切片（最多 PAGE_SIZE 条） */
    function getPageSlice(fundId) {
      const fund = window.FUND_HOLDINGS[fundId];
      const page = getCurrentPage(fundId);
      const start = (page - 1) * PAGE_SIZE;
      const holdings = fund.holdings.slice(start, start + PAGE_SIZE);
      return { fund, page, start, holdings };
    }

    function updatePagerUI(fundId) {
      const page = getCurrentPage(fundId);
      const panel = document.querySelector(`[data-panel="${fundId}"]`);
      if (!panel) return;

      panel.querySelectorAll("[data-page-num]").forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.pageNum) === page);
      });
    }

    /** 翻页：先持久化当前页输入，再只渲染目标页行 */
    function goToPage(fundId, page) {
      persistFromDom();
      setCurrentPage(fundId, page);
      renderFundRows(fundId);
      updatePagerUI(fundId);
      applyAllChangeColors(fundId);
      syncFundQuotes(fundId);
    }

    function buildPagerHtml(fund) {
      if (fund.holdings.length <= PAGE_SIZE) return "";

      const total = getTotalPages(fund);
      const pageBtns = Array.from({ length: total }, (_, i) => {
        const n = i + 1;
        return `<button class="pager-btn" type="button" data-page-num="${n}" data-fund-page="${fund.id}">${n}</button>`;
      }).join("");

      return `
        <div class="pager">
          <div class="pager-btns">
            ${pageBtns}
          </div>
        </div>
      `;
    }

    function loadInputs() {
      return loadJson(STORAGE_KEY, {});
    }

    function saveInputs(all) {
      saveJson(STORAGE_KEY, all);
    }

    function formatPct(n) {
      const sign = n > 0 ? "+" : "";
      return sign + n.toFixed(2) + "%";
    }

    function applyChangeColor(input) {
      const field = input.closest(".change-field") || input;
      input.classList.remove("up", "down");
      field.classList.remove("up", "down");

      const raw = input.value.trim();
      if (raw === "" || Number.isNaN(Number(raw))) return;
      const n = Number(raw);
      if (n > 0) {
        input.classList.add("up");
        field.classList.add("up");
      } else if (n < 0) {
        input.classList.add("down");
        field.classList.add("down");
      }
    }

    function applyAllChangeColors(fundId) {
      const selector = fundId
        ? `input[data-fund="${fundId}"]`
        : "input[data-fund]";
      document.querySelectorAll(selector).forEach(applyChangeColor);
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function toneClass(n) {
      if (n > 0) return "up";
      if (n < 0) return "down";
      return "flat";
    }

    function formatPrice(n) {
      if (n == null || Number.isNaN(n)) return "--";
      const abs = Math.abs(n);
      if (abs >= 1000) return n.toFixed(0);
      if (abs >= 100) return n.toFixed(1);
      return n.toFixed(2);
    }

    /** 金额/市值（元）格式化为 万 / 亿 / 万亿 */
    function formatMarketCap(n) {
      if (n == null || Number.isNaN(n)) return "--";
      const abs = Math.abs(n);
      const sign = n < 0 ? "-" : "";
      if (abs >= 1e12) return sign + (abs / 1e12).toFixed(2) + "万亿";
      if (abs >= 1e8) return sign + (abs / 1e8).toFixed(2) + "亿";
      if (abs >= 1e4) return sign + (abs / 1e4).toFixed(2) + "万";
      return sign + abs.toFixed(0);
    }

    function formatYoy(n) {
      if (n == null || Number.isNaN(n)) return "";
      return `<span class="profile-yoy ${toneClass(n)}">${formatPct(n)}</span>`;
    }

    function setStatus(elOrId, msg) {
      const el = typeof elOrId === "string" ? document.getElementById(elOrId) : elOrId;
      if (!el) return;
      if (!msg) {
        el.classList.remove("show");
        el.textContent = "";
        return;
      }
      el.textContent = msg;
      el.classList.add("show");
    }

    function syncBodyScroll() {
      const anyOpen = MODAL_IDS.some((id) =>
        document.getElementById(id)?.classList.contains("show")
      );
      document.body.style.overflow = anyOpen ? "hidden" : "";
    }

    function showModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
      syncBodyScroll();
    }

    function hideModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      syncBodyScroll();
    }

    function resetPeriodValues() {
      document.querySelectorAll("[data-period-value]").forEach((el) => {
        el.textContent = "--";
        el.className = "value";
      });
      document.querySelectorAll(".chart-period").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.chartRange === "day");
      });
    }

    function renderPeriodReturns(returns) {
      Object.entries(returns || {}).forEach(([key, value]) => {
        const el = document.querySelector(`[data-period-value="${key}"]`);
        if (!el) return;
        if (value == null || Number.isNaN(value)) {
          el.textContent = "--";
          el.className = "value";
          return;
        }
        el.textContent = formatPct(value);
        el.className = "value " + toneClass(value);
      });
    }

    function buildRangeSeries(range, state) {
      if (range === "day") {
        if (!state.trend) return null;
        return {
          title: "当日分时",
          baseline: state.trend.preClose,
          baselineLabel: "昨收",
          points: state.trend.points.map((p) => ({
            label: p.time,
            price: p.price,
            avg: p.avg,
            volume: p.volume
          })),
          showAvg: true
        };
      }

      if (!state.history?.klines?.length) return null;
      const sliced = sliceKlinesForRange(state.history.klines, range);
      if (sliced.length < 2) return null;

      const labels = {
        "1m": "近1月",
        "3m": "近3月",
        "6m": "近半年",
        ytd: "今年以来",
        "1y": "近1年"
      };

      return {
        title: labels[range] || "走势",
        baseline: sliced[0].close,
        baselineLabel: "起点",
        points: sliced.map((k) => ({
          label: k.date.slice(5),
          price: k.close,
          avg: null,
          volume: k.volume
        })),
        showAvg: false
      };
    }

    function drawIntradayChart(canvas, series) {
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || 320;
      const cssH = canvas.clientHeight || 280;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);

      const points = series.points;
      if (!points?.length) return;

      const pad = { top: 16, right: 52, bottom: 56, left: 52 };
      const volH = 48;
      const plotW = cssW - pad.left - pad.right;
      const plotH = cssH - pad.top - pad.bottom - volH - 10;
      const volTop = pad.top + plotH + 10;

      const prices = points.map((p) => p.price);
      let minP = Math.min(...prices);
      let maxP = Math.max(...prices);
      if (series.baseline != null) {
        minP = Math.min(minP, series.baseline);
        maxP = Math.max(maxP, series.baseline);
      }
      const span = maxP - minP || Math.abs(maxP) * 0.01 || 1;
      minP -= span * 0.08;
      maxP += span * 0.08;

      const maxVol = Math.max(...points.map((p) => p.volume || 0), 1);
      const last = points[points.length - 1];
      const base =
        series.baseline != null && series.baseline !== 0
          ? series.baseline
          : null;
      const lineColor =
        base == null
          ? "#1677ff"
          : last.price >= base
            ? "#e64545"
            : "#12a150";

      function xAt(i) {
        if (points.length === 1) return pad.left + plotW / 2;
        return pad.left + (i / (points.length - 1)) * plotW;
      }

      function yAt(price) {
        return pad.top + ((maxP - price) / (maxP - minP)) * plotH;
      }

      ctx.strokeStyle = "#edf0f5";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad.top + (plotH * i) / 4;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + plotW, y);
        ctx.stroke();
      }

      if (base != null) {
        const y = yAt(base);
        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "#94a3b8";
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + plotW, y);
        ctx.stroke();
        ctx.restore();
      }

      ctx.beginPath();
      points.forEach((p, i) => {
        const x = xAt(i);
        const y = yAt(p.price);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      const lastX = xAt(points.length - 1);
      ctx.lineTo(lastX, pad.top + plotH);
      ctx.lineTo(xAt(0), pad.top + plotH);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
      grad.addColorStop(0, lineColor + "33");
      grad.addColorStop(1, lineColor + "00");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      points.forEach((p, i) => {
        const x = xAt(i);
        const y = yAt(p.price);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = "round";
      ctx.stroke();

      if (series.showAvg) {
        let started = false;
        ctx.beginPath();
        points.forEach((p, i) => {
          if (p.avg == null) return;
          const x = xAt(i);
          const y = yAt(p.avg);
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        });
        if (started) {
          ctx.strokeStyle = "#f59e0b";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      const barW = Math.max(1, plotW / points.length - 0.5);
      points.forEach((p, i) => {
        const h = ((p.volume || 0) / maxVol) * volH;
        const x = xAt(i) - barW / 2;
        const y = volTop + volH - h;
        const up =
          i === 0
            ? base == null || p.price >= base
            : p.price >= points[i - 1].price;
        ctx.fillStyle = up ? "rgba(230, 69, 69, 0.35)" : "rgba(18, 161, 80, 0.35)";
        ctx.fillRect(x, y, barW, h);
      });

      ctx.font = '11px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 4; i++) {
        const price = maxP - ((maxP - minP) * i) / 4;
        const y = pad.top + (plotH * i) / 4;
        ctx.fillStyle = "#8a8f98";
        ctx.textAlign = "right";
        ctx.fillText(formatPrice(price), pad.left - 8, y);

        if (base != null) {
          const pct = ((price - base) / base) * 100;
          ctx.textAlign = "left";
          ctx.fillStyle =
            pct > 0.005 ? "#e64545" : pct < -0.005 ? "#12a150" : "#8a8f98";
          ctx.fillText(formatPct(pct), pad.left + plotW + 8, y);
        }
      }

      ctx.fillStyle = "#8a8f98";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const timeIdx = [0, Math.floor((points.length - 1) / 2), points.length - 1];
      timeIdx.forEach((i) => {
        ctx.fillText(points[i].label, xAt(i), cssH - 18);
      });

      ctx.textAlign = "left";
      ctx.fillText("成交量", pad.left, volTop - 2);
    }

      const priceEl = document.getElementById("chartModalPrice");
      const chgEl = document.getElementById("chartModalChg");
      priceEl.textContent = formatPrice(last.price);

      document.getElementById("chartModalName").textContent = name || "--";
      document.getElementById("chartModalSub").textContent =
        `${series.title} · ${series.baselineLabel || "基准"} ${formatPrice(base)}`;

    async function openChartModal(fundId, index) {
      const fund = window.FUND_HOLDINGS[fundId];
      const holding = fund?.holdings?.[index];
      if (!holding) return;

      const canvas = document.getElementById("chartCanvas");
      const reqId = ++chartRequestId;

      document.getElementById("chartModalName").textContent =
        holding.name;
      document.getElementById("chartModalSub").textContent = "加载行情中…";
      document.getElementById("chartModalPrice").textContent = "--";
      document.getElementById("chartModalPrice").className = "price flat";
      document.getElementById("chartModalChg").textContent = "--";
      document.getElementById("chartModalChg").className = "chg flat";
      resetPeriodValues();
      canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);

      openChartModal._state = {
        range: "day",
        trend: null,
        history: null,
        returns: null,
        holding
      };
      openChartModal._lastSeries = null;

      showModal("chartModal");
      setStatus("chartStatus", "加载分时与区间涨跌幅…");

      const [trendResult, historyResult] = await Promise.allSettled([
        loadIntradayTrends(holding),
        loadDailyKlines(holding)
      ]);

      if (reqId !== chartRequestId) return;

      const state = {
        range: "day",
        trend: trendResult.status === "fulfilled" ? trendResult.value : null,
        history: historyResult.status === "fulfilled" ? historyResult.value : null,
        returns: null,
        holding
      };

      if (state.history) {
        state.returns = calcPeriodReturns(state.history.klines);
      } else {
        state.returns = { day: null, "1m": null, "3m": null, "6m": null, ytd: null, "1y": null };
      }

      if (state.trend?.preClose != null && state.trend.points?.length) {
        const last = state.trend.points[state.trend.points.length - 1];
        state.returns.day =
          Math.round(((last.price - state.trend.preClose) / state.trend.preClose) * 10000) / 100;
      }
      renderPeriodReturns(state.returns);

      openChartModal._state = state;

      if (!state.trend && !state.history) {
        openChartModal._lastSeries = null;
        setStatus("chartStatus", "行情加载失败，请稍后重试");
        return;
      }

      if (!state.trend && state.history) {
        state.range = "1m";
        document.querySelectorAll(".chart-period").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.chartRange === "1m");
        });
      }

      renderActiveChart();
    }

    function formatHolderChange(h) {
      const action = h.action || "--";
      let tone = "flat";
      if (action === "增持" || action === "新进") tone = "up";
      else if (action === "减持") tone = "down";

      let detail = "";
      if (h.changeRatio != null && !Number.isNaN(h.changeRatio)) {
        detail = formatPct(h.changeRatio);
      } else if (
        h.changeShares != null &&
        !Number.isNaN(h.changeShares) &&
        action !== "新进" &&
        action !== "不变"
      ) {
        const abs = Math.abs(h.changeShares);
        const sign = h.changeShares > 0 ? "+" : "-";
        if (abs >= 1e8) detail = sign + (abs / 1e8).toFixed(2) + "亿股";
        else if (abs >= 1e4) detail = sign + (abs / 1e4).toFixed(2) + "万股";
        else detail = sign + abs.toFixed(0) + "股";
      }

      return `<span class="holder-change ${tone}"><span class="action">${action}</span>${
        detail ? `<span class="detail">${detail}</span>` : ""
      }</span>`;
    }

    function renderProfileHolders(holders, holdersError) {
      const listEl = document.getElementById("profileHolders");
      const emptyEl = document.getElementById("profileHoldersEmpty");
      const dateEl = document.getElementById("profileHoldersDate");
      const summaryEl = document.getElementById("profileChangeSummary");
      if (!listEl || !emptyEl || !dateEl || !summaryEl) return;

      listEl.innerHTML = "";
      emptyEl.textContent = "";
      summaryEl.hidden = true;
      summaryEl.innerHTML = "";

      if (!holders?.list?.length) {
        dateEl.textContent = "";

      dateEl.textContent = holders.date ? `截至 ${holders.date}` : "";

      const counts = { 新进: 0, 增持: 0, 减持: 0, 不变: 0 };
      holders.list.forEach((h) => {
        if (counts[h.action] != null) counts[h.action] += 1;
      });
      const chips = [];
      if (counts["新进"]) chips.push(`<span class="up">新进 ${counts["新进"]}</span>`);
      if (counts["增持"]) chips.push(`<span class="up">增持 ${counts["增持"]}</span>`);
      if (counts["减持"]) chips.push(`<span class="down">减持 ${counts["减持"]}</span>`);
      if (counts["不变"]) chips.push(`<span class="flat">不变 ${counts["不变"]}</span>`);
      if (chips.length) {
        summaryEl.hidden = false;
        summaryEl.innerHTML = `本期变动：${chips.join('<span class="sep">·</span>')}`;
      }

      listEl.innerHTML = holders.list
        .map(
          (h) => `
          <div class="profile-holder-row">
            <div class="holder-rank">${h.rank || "--"}</div>
            <div class="holder-name" title="${h.name}">${h.name}</div>

              h.ratio != null ? h.ratio.toFixed(2) + "%" : "--"

    function drawSparkline(canvas, points, baseline) {
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || 120;
      const cssH = canvas.clientHeight || 44;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);
      if (!points?.length) return;

      const padY = 2;
      const prices = points.map((p) => p.price);
      let minP = Math.min(...prices);
      let maxP = Math.max(...prices);
      if (baseline != null) {
        minP = Math.min(minP, baseline);
        maxP = Math.max(maxP, baseline);
      }
      const span = maxP - minP || Math.abs(maxP) * 0.01 || 1;
      minP -= span * 0.06;
      maxP += span * 0.06;

      const last = points[points.length - 1];
      const lineColor =
        baseline == null
          ? "#1677ff"
          : last.price >= baseline
            ? "#e64545"
            : "#12a150";

      function xAt(i) {
        if (points.length === 1) return cssW / 2;
        return (i / (points.length - 1)) * cssW;
      }
      function yAt(price) {
        return padY + ((maxP - price) / (maxP - minP)) * (cssH - padY * 2);
      }

      if (baseline != null) {
        const y = yAt(baseline);
        ctx.save();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cssW, y);
        ctx.stroke();
        ctx.restore();
      }

      ctx.beginPath();
      points.forEach((p, i) => {
        const x = xAt(i);
        const y = yAt(p.price);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      const lastX = xAt(points.length - 1);
      ctx.lineTo(lastX, cssH);
      ctx.lineTo(xAt(0), cssH);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, 0, 0, cssH);
      grad.addColorStop(0, lineColor + "33");
      grad.addColorStop(1, lineColor + "00");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      points.forEach((p, i) => {
        const x = xAt(i);
        const y = yAt(p.price);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 1.5;
      ctx.lineJoin = "round";
      ctx.stroke();
    }

    async function openBoardStocksModal(boardCode, boardName, boardCodes) {
      const codes = (Array.isArray(boardCodes)
        ? boardCodes

      )
        .map((c) => String(c || "").trim())
        .filter(Boolean);
      // 子板块过多时取市值靠前的若干个，避免请求过多
      const fetchCodes = codes.slice(0, 10);

      const reqId = ++boardStocksRequestId;

        codes.length > 1

      setStatus("boardStatus", "加载中…");

          loadCnIndices(),
          loadCnSectorBoards()
        ]);
        if (requestId !== loadBoardList._req) return;

        const indices =
          indicesResult.status === "fulfilled" ? indicesResult.value : [];
        const list =
          boardsResult.status === "fulfilled" ? boardsResult.value : [];

        openBoardModal._indices = indices;
        openBoardModal._list = list;
        renderCnIndices(indices);

        if (boardsResult.status === "rejected" && !indices.length) {
          throw boardsResult.reason || new Error("板块数据加载失败");
        }

        document.getElementById("boardModalSub").textContent =
          list.length
            ? `共 ${list.length} 个行业板块（相近已归类）· 按涨跌幅排序`

              ? "行业板块加载失败"

        setStatus(
          "boardStatus",
          list.length || indices.length
            ? ""
            : "暂无板块数据"
        );

        if (indices.length) {
          const sparkReq = requestId;
          requestAnimationFrame(() => {
            if (sparkReq !== loadBoardList._req) return;
            paintCnIndexSparklines(indices).catch(() => {});
          });

      } catch (err) {
        if (requestId !== loadBoardList._req) return;
        document.getElementById("boardModalSub").textContent = "加载失败";
        setStatus("boardStatus", err?.message || "板块数据加载失败，请稍后重试");

    async function syncFundQuotes(fundId) {
      const btn = document.querySelector(`[data-sync="${fundId}"]`);
      if (!btn) return;

      const { fund, start, holdings: pageHoldings } = getPageSlice(fundId);
      if (!pageHoldings.length) return;

      const requestId = (syncFundQuotes._req = (syncFundQuotes._req || 0) + 1);
      btn.disabled = true;
      btn.classList.add("loading");

      try {
        const sparkPromise = Promise.allSettled(
          pageHoldings.map((h) => loadIntradayTrends(h))
        );
        const quotes = await loadQuotes(pageHoldings);
        if (requestId !== syncFundQuotes._req) return;

        let ok = 0;
        const failed = [];

        pageHoldings.forEach((h, offset) => {
          const i = start + offset;
          const quote = quotes[h.code] || quotes[quoteKey(h.code)];
          const input = document.querySelector(
            `input[data-fund="${fundId}"][data-index="${i}"]`
          );

          if (!quote || !input || Number.isNaN(quote.change)) {
            failed.push(h.name);
            return;
          }
          input.value = quote.change.toFixed(2);
          applyChangeColor(input);
          ok += 1;
        });

        persistFromDom();

        const sparkResults = await sparkPromise;
        if (requestId !== syncFundQuotes._req) return;
        const trends = sparkResults.map((result) =>
          result.status === "fulfilled" ? result.value : null
        );
        fundSparkTrends[fundId] = { start, trends };
        paintFundSparklines(fundId);

        if (ok === 0) {
          showToast("未获取到行情，请稍后重试");
          return;
        }

        const page = getCurrentPage(fundId);
        const total = getTotalPages(fund);
        const pageTip = total > 1 ? `（第 ${page}/${total} 页）` : "";
        const msg = failed.length
          ? `已同步 ${ok} 只${pageTip}，失败：${failed.join("、")}`
          : `已同步 ${ok} 只股票实时涨跌幅`;
        showToast(msg);
      } catch (err) {
        showToast(err.message || "同步失败");
      } finally {
        if (requestId === syncFundQuotes._req) {
          btn.disabled = false;
          btn.classList.remove("loading");
        }
      }
    }

    const fundSparkTrends = {};

    function paintFundSparklines(fundId) {
      const cached = fundSparkTrends[fundId];
      if (!cached?.trends?.length) return;
      const { start, trends } = cached;
      trends.forEach((trend, offset) => {
        const i = start + offset;
        const canvas = document.querySelector(
          `canvas[data-row-spark][data-fund="${fundId}"][data-index="${i}"]`
        );
        if (!canvas) return;
        if (!trend) {
          const ctx = canvas.getContext("2d");
          if (ctx) {
            const dpr = window.devicePixelRatio || 1;
            const cssW = canvas.clientWidth || 72;
            const cssH = canvas.clientHeight || 28;
            canvas.width = Math.round(cssW * dpr);
            canvas.height = Math.round(cssH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
          }
          return;
        }
        drawSparkline(canvas, trend.points, trend.preClose);
      });
    }

    function persistFromDom() {
      const saved = loadInputs();
      document.querySelectorAll("input[data-fund]").forEach((input) => {
        const fundId = input.dataset.fund;
        const index = input.dataset.index;
        if (!saved[fundId]) saved[fundId] = {};
        saved[fundId][index] = input.value === "" ? "" : input.value;
      });
      saveInputs(saved);
    }

    function calcFund(fundId) {
      const fund = window.FUND_HOLDINGS[fundId];
      if (fund.viewOnly) return;
      persistFromDom();
      const saved = loadInputs()[fundId] || {};
      let weighted = 0;
      let filledWeight = 0;
      let filledCount = 0;
      let missing = [];

      fund.holdings.forEach((h, i) => {
        const raw = String(saved[i] ?? "").trim();
        if (raw === "" || Number.isNaN(Number(raw))) {
          missing.push(h.name);
          return;
        }
        const change = Number(raw);
        weighted += h.ratio * change;
        filledWeight += h.ratio;
        filledCount += 1;
      });

      const estimate = weighted / 100;
      const resultEl = document.getElementById(`result-${fundId}`);
      const valueEl = document.getElementById(`value-${fundId}`);
      const detailEl = document.getElementById(`detail-${fundId}`);

      resultEl.classList.add("show");
      valueEl.textContent = formatPct(estimate);
      valueEl.className = "value " + (estimate > 0 ? "up" : estimate < 0 ? "down" : "flat");

      const coverLabel = fund.market === "US" ? "等权合计" : "前十大合计";
      const parts = [
        `已填写 ${filledCount}/${fund.holdings.length} 只，覆盖权重 ${filledWeight.toFixed(2)}%（${coverLabel} ${fund.top10Total.toFixed(2)}%）。`
      ];
      if (missing.length) {
        parts.push(`未填写：${missing.join("、")}（按 0 处理）。`);
      }
      detailEl.textContent = parts.join(" ");
    }

    async function addCustomStock(fundId) {
      if (!CUSTOMIZABLE_FUNDS.has(fundId)) return;
      const fund = window.FUND_HOLDINGS[fundId];
      const input = document.querySelector(`[data-add-code="${fundId}"]`);
      const btn = document.querySelector(`[data-add-stock="${fundId}"]`);
      const raw = (input?.value || "").trim();
      if (!raw) {
        showToast(fund.market === "US" ? "请输入美股代码" : "请输入 A 股代码");
        input?.focus();
        return;
      }

      if (btn) btn.disabled = true;
      try {
        const stock = await resolveStock(raw, fund.market === "US" ? "US" : "CN");
        const all = loadCustomStocks();
        const list = all[fundId] || [];
        const existsCustom = list.some(
          (h) => quoteKey(h.code) === quoteKey(stock.code)
        );
        const existsDefault = (fund._defaultHoldings || fund.holdings).some(
          (h) => quoteKey(h.code) === quoteKey(stock.code)
        );
        if (existsCustom || existsDefault) {
          showToast(`${stock.name}（${stock.code}）已在列表中`);
          return;
        }

        all[fundId] = [
          { name: stock.name, code: stock.code, market: stock.market, ratio: stock.ratio },
          ...list
        ];
        saveCustomStocks(all);

        // 新增后回到第 1 页，并清掉该页签按 index 缓存的涨跌幅（避免错位）
        pageState[fundId] = 1;
        const saved = loadInputs();
        delete saved[fundId];
        saveInputs(saved);

        if (input) input.value = "";
        showToast(`已添加 ${stock.name}（${stock.code}）`);
        rerender(fundId);
      } catch (err) {
        showToast(err.message || "添加失败");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function removeCustomStock(fundId, code) {
      if (!CUSTOMIZABLE_FUNDS.has(fundId)) return;
      const all = loadCustomStocks();
      const list = all[fundId] || [];
      const next = list.filter((h) => quoteKey(h.code) !== quoteKey(code));
      if (next.length === list.length) return;
      all[fundId] = next;
      saveCustomStocks(all);

      pageState[fundId] = 1;
      const saved = loadInputs();
      delete saved[fundId];
      saveInputs(saved);

      showToast("已移除自选股票");
      rerender(fundId);
    }

    function getTabButtons() {
      return Array.from(document.querySelectorAll(".tabs .tab"));
    }

    function updateTabArrows() {
      const tabs = getTabButtons();
      const index = tabs.findIndex((t) => t.classList.contains("active"));
      const prevBtn = document.querySelector("[data-tab-prev]");
      const nextBtn = document.querySelector("[data-tab-next]");
      if (prevBtn) prevBtn.disabled = index <= 0;
      if (nextBtn) nextBtn.disabled = index < 0 || index >= tabs.length - 1;
    }

    function applyActivePanel(fundId) {
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      const panel = document.querySelector(`[data-panel="${fundId}"]`);
      if (panel) panel.classList.add("active");
    }

    function switchTab(tabOrFundId, { forceSync = false } = {}) {
      const prevFundId = getActiveFundId();

      if (isWatchFund(tabOrFundId)) {
        activeMainTab = "funds";
        activeWatchFundId = tabOrFundId;
      } else if (tabOrFundId === "funds") {
        activeMainTab = "funds";
        if (!isWatchFund(activeWatchFundId)) {
          activeWatchFundId = WATCH_FUND_IDS[0];
        }
      } else if (tabOrFundId === "usSemi") {
        activeMainTab = "usSemi";
      } else {
        activeMainTab = "cnSemi";
      }

      const fundId = getActiveFundId();
      const alreadyActive = prevFundId === fundId && !forceSync;

      renderTabs();
      renderFundPicker();
      applyActivePanel(fundId);

      const tab = getTabButtons().find((t) => t.dataset.tab === activeMainTab);
      tab?.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      updateTabArrows();

      if (!alreadyActive || forceSync) {
        syncFundQuotes(fundId);
      }
    }

    function shiftTab(step) {
      const tabs = getTabButtons();
      const index = tabs.findIndex((t) => t.classList.contains("active"));
      const next = tabs[index + step];
      if (next) switchTab(next.dataset.tab);
    }

    document.addEventListener("click", (e) => {
      if (e.target.closest("[data-us-board-close]")) {
        closeUsBoardModal();
        return;
      }

      const usRankBtn = e.target.closest("[data-us-rank]");
      if (usRankBtn) {
        loadUsRankKind(usRankBtn.dataset.usRank);
        return;
      }

      if (e.target.closest("[data-board-stocks-close]")) {
        closeBoardStocksModal();
        return;
      }

      if (e.target.closest("[data-board-close]")) {
        closeBoardModal();
        return;
      }

      const boardRowBtn = e.target.closest("[data-board-code]");
      if (boardRowBtn) {
        openBoardStocksModal(
          boardRowBtn.dataset.boardCode,
          boardRowBtn.dataset.boardName,
          boardRowBtn.dataset.boardCodes
        );
        return;
      }

      const openBoardBtn = e.target.closest("[data-open-board]");
      if (openBoardBtn) {
        if (openBoardBtn.dataset.openBoard === "us") openUsBoardModal();
        else openBoardModal();
        return;
      }

      if (e.target.closest("[data-profile-close]")) {
        closeProfileModal();
        return;
      }

      const profileKindBtn = e.target.closest("[data-profile-kind]");
      if (profileKindBtn) {
        setProfileKind(profileKindBtn.dataset.profileKind);
        return;
      }

      if (e.target.closest("[data-open-profile]")) {
        openProfileModal();
        return;
      }

      if (e.target.closest("[data-chart-close]")) {
        closeChartModal();
        return;
      }

      const rangeBtn = e.target.closest("[data-chart-range]");
      if (rangeBtn) {
        setChartRange(rangeBtn.dataset.chartRange);
        return;
      }

      const removeBtn = e.target.closest("[data-remove-stock]");
      if (removeBtn) {
        removeCustomStock(removeBtn.dataset.removeStock, removeBtn.dataset.removeCode);
        return;
      }

      const chartName = e.target.closest("[data-chart-fund]");
      if (chartName) {
        openChartModal(chartName.dataset.chartFund, Number(chartName.dataset.chartIndex));
        return;
      }

      const pageNum = e.target.closest("[data-page-num]");
      if (pageNum) {
        const fundId = pageNum.dataset.fundPage;
        const nextPage = Number(pageNum.dataset.pageNum);
        if (nextPage === getCurrentPage(fundId)) return;
        goToPage(fundId, nextPage);
        return;
      }

      if (e.target.closest("[data-tab-prev]")) {
        shiftTab(-1);
        return;
      }

      if (e.target.closest("[data-tab-next]")) {
        shiftTab(1);
        return;
      }

      const tab = e.target.closest(".tab");
      if (tab) {
        switchTab(tab.dataset.tab);
        return;
      }

      const fundPick = e.target.closest("[data-fund-pick]");
      if (fundPick) {
        switchTab(fundPick.dataset.fundPick);
        return;
      }

      const syncBtn = e.target.closest("[data-sync]");
      if (syncBtn) {
        syncFundQuotes(syncBtn.dataset.sync);
        return;
      }

      const calcBtn = e.target.closest("[data-calc]");
      if (calcBtn) {
        calcFund(calcBtn.dataset.calc);
        return;
      }

      const addBtn = e.target.closest("[data-add-stock]");
      if (addBtn) {
        addCustomStock(addBtn.dataset.addStock);
        return;
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const profileModal = document.getElementById("profileModal");
        if (profileModal?.classList.contains("show")) {
          closeProfileModal();
          return;
        }
        const boardStocksModal = document.getElementById("boardStocksModal");
        if (boardStocksModal?.classList.contains("show")) {
          closeBoardStocksModal();
          return;
        }
        const usBoardModal = document.getElementById("usBoardModal");
        if (usBoardModal.classList.contains("show")) {
          closeUsBoardModal();
          return;
        }
        const boardModal = document.getElementById("boardModal");
        if (boardModal.classList.contains("show")) {
          closeBoardModal();
          return;
        }
        const modal = document.getElementById("chartModal");
        if (modal.classList.contains("show")) closeChartModal();
        return;
      }

      if (e.key === "Enter" && e.target.matches?.("[data-add-code]")) {
        e.preventDefault();
        addCustomStock(e.target.dataset.addCode);
        return;
      }

      const chartName = e.target.closest?.("[data-chart-fund]");
      if (chartName && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        openChartModal(chartName.dataset.chartFund, Number(chartName.dataset.chartIndex));
      }
    });

    window.addEventListener("resize", () => {
      const chartModal = document.getElementById("chartModal");
      if (chartModal.classList.contains("show") && openChartModal._lastSeries) {
        drawIntradayChart(document.getElementById("chartCanvas"), openChartModal._lastSeries);
      }
      const boardModal = document.getElementById("boardModal");
      if (boardModal?.classList.contains("show")) {
        redrawCnIndexSparklines();
      }
      const usBoardModal = document.getElementById("usBoardModal");
      if (usBoardModal?.classList.contains("show")) {
        redrawUsIndexSparklines();
      }
      const activeFundId = getActiveFundId();
      if (activeFundId) paintFundSparklines(activeFundId);
    });

    document.addEventListener("input", (e) => {
      if (e.target.matches("input[data-fund]")) {
        applyChangeColor(e.target);
        persistFromDom();
      }
    });

    applyCustomHoldings();
    render();
    switchTab(activeMainTab, { forceSync: true });
    updateTabArrows();
  </script>
</body>
</html>
