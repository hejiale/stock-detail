<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>基金持仓收益估算</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>基金持仓收益估算</h1>
      <p>根据前十大持仓比例，输入各股票当日涨跌幅，估算基金当日收益。</p>
    </header>

    <div class="tabs-bar">
      <button class="tabs-arrow" type="button" data-tab-prev aria-label="上一个">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M10.2 2.6 4.8 8l5.4 5.4 1.2-1.2L7.2 8l4.2-4.2-1.2-1.2z"/>
        </svg>
      </button>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="dongfang" type="button">东方</button>
        <button class="tab" data-tab="caitong" type="button">财通</button>
        <button class="tab" data-tab="huaxia" type="button">华夏</button>
        <button class="tab" data-tab="guangfa" type="button">广发</button>
        <button class="tab" data-tab="jianxin" type="button">建信</button>
        <button class="tab" data-tab="usSemi" type="button">美股</button>
      </div>
      <button class="tabs-arrow" type="button" data-tab-next aria-label="下一个">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M5.8 2.6 4.6 3.8 8.8 8l-4.2 4.2 1.2 1.2L11.2 8 5.8 2.6z"/>
        </svg>
      </button>
    </div>

    <div id="panels"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="chart-modal" id="chartModal" aria-hidden="true">
    <div class="chart-modal-backdrop" data-chart-close></div>
    <div class="chart-modal-panel" role="dialog" aria-modal="true" aria-labelledby="chartModalName">
      <div class="chart-modal-head">
        <div class="chart-modal-title">
          <div class="name" id="chartModalName">--</div>
          <div class="sub" id="chartModalSub">当日分时走势</div>
          <div class="chart-modal-meta">
            <span class="price flat" id="chartModalPrice">--</span>
            <span class="chg flat" id="chartModalChg">--</span>
          </div>
        </div>
        <button class="chart-modal-close" type="button" data-chart-close aria-label="关闭">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M3.5 2.4 8 6.9l4.5-4.5 1.1 1.1L9.1 8l4.5 4.5-1.1 1.1L8 9.1l-4.5 4.5-1.1-1.1L6.9 8 2.4 3.5l1.1-1.1z"/>
          </svg>
        </button>
      </div>
      <div class="chart-periods" id="chartPeriods">
        <button class="chart-period active" type="button" data-chart-range="day">
          <span class="label">当日</span>
          <span class="value" data-period-value="day">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="1m">
          <span class="label">近1月</span>
          <span class="value" data-period-value="1m">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="3m">
          <span class="label">近3月</span>
          <span class="value" data-period-value="3m">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="6m">
          <span class="label">近半年</span>
          <span class="value" data-period-value="6m">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="ytd">
          <span class="label">今年以来</span>
          <span class="value" data-period-value="ytd">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="1y">
          <span class="label">近1年</span>
          <span class="value" data-period-value="1y">--</span>
        </button>
      </div>
      <div class="chart-modal-body">
        <div class="chart-canvas-wrap">
          <canvas id="chartCanvas"></canvas>
        </div>
        <div class="chart-status" id="chartStatus">加载中…</div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="api.js"></script>
  <script>
    const {
      quoteKey,
      loadQuotes,
      loadIntradayTrends,
      loadDailyKlines,
      calcPeriodReturns,
      sliceKlinesForRange
    } = window.MarketAPI;

    const STORAGE_KEY = "fund_daily_returns_v1";
    const PAGE_SIZE = 10;
    const pageState = {};

    function getTotalPages(fund) {
      return Math.max(1, Math.ceil(fund.holdings.length / PAGE_SIZE));
    }

    function getCurrentPage(fundId) {
      return pageState[fundId] || 1;
    }

    function setCurrentPage(fundId, page) {
      const fund = window.FUND_HOLDINGS[fundId];
      const total = getTotalPages(fund);
      pageState[fundId] = Math.min(Math.max(1, page), total);
    }

    function applyPage(fundId) {
      const fund = window.FUND_HOLDINGS[fundId];
      const page = getCurrentPage(fundId);
      const total = getTotalPages(fund);
      const panel = document.querySelector(`[data-panel="${fundId}"]`);
      if (!panel) return;

      panel.querySelectorAll(".row[data-index]").forEach((row) => {
        const index = Number(row.dataset.index);
        const rowPage = Math.floor(index / PAGE_SIZE) + 1;
        row.hidden = rowPage !== page;
      });

      const info = panel.querySelector(".pager-info");
      if (info) {
        const start = (page - 1) * PAGE_SIZE + 1;
        const end = Math.min(page * PAGE_SIZE, fund.holdings.length);
        info.textContent = `第 ${page}/${total} 页 · ${start}-${end} / ${fund.holdings.length}`;
      }

      const prevBtn = panel.querySelector("[data-page-prev]");
      const nextBtn = panel.querySelector("[data-page-next]");
      if (prevBtn) prevBtn.disabled = page <= 1;
      if (nextBtn) nextBtn.disabled = page >= total;

      panel.querySelectorAll("[data-page-num]").forEach((btn) => {
        const n = Number(btn.dataset.pageNum);
        btn.classList.toggle("active", n === page);
      });
    }

    function buildPagerHtml(fund) {
      const total = getTotalPages(fund);
      if (fund.holdings.length <= PAGE_SIZE) {
        return `<div class="pager"><div class="pager-info">共 ${fund.holdings.length} 条</div></div>`;
      }

      const pageBtns = Array.from({ length: total }, (_, i) => {
        const n = i + 1;
        return `<button class="pager-btn" type="button" data-page-num="${n}" data-fund-page="${fund.id}">${n}</button>`;
      }).join("");

      return `
        <div class="pager">
          <div class="pager-info"></div>
          <div class="pager-btns">
            <button class="pager-btn" type="button" data-page-prev="${fund.id}">上一页</button>
            ${pageBtns}
            <button class="pager-btn" type="button" data-page-next="${fund.id}">下一页</button>
          </div>
        </div>
      `;
    }

    function loadInputs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveInputs(all) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    }

    function formatPct(n) {
      const sign = n > 0 ? "+" : "";
      return sign + n.toFixed(2) + "%";
    }

    function applyChangeColor(input) {
      const field = input.closest(".change-field") || input;
      input.classList.remove("up", "down");
      field.classList.remove("up", "down");

      const raw = input.value.trim();
      if (raw === "" || Number.isNaN(Number(raw))) return;
      const n = Number(raw);
      if (n > 0) {
        input.classList.add("up");
        field.classList.add("up");
      } else if (n < 0) {
        input.classList.add("down");
        field.classList.add("down");
      }
    }

    function applyAllChangeColors(fundId) {
      const selector = fundId
        ? `input[data-fund="${fundId}"]`
        : "input[data-fund]";
      document.querySelectorAll(selector).forEach(applyChangeColor);
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function applyPreChangeDisplay(el, value) {
      if (!el) return;
      el.classList.remove("up", "down");
      if (value == null || Number.isNaN(Number(value))) {
        el.textContent = "--";
        return;
      }
      const n = Number(value);
      el.textContent = formatPct(n);
      if (n > 0) el.classList.add("up");
      else if (n < 0) el.classList.add("down");
    }

    function toneClass(n) {
      if (n > 0) return "up";
      if (n < 0) return "down";
      return "flat";
    }

    function formatPrice(n) {
      if (n == null || Number.isNaN(n)) return "--";
      const abs = Math.abs(n);
      if (abs >= 1000) return n.toFixed(0);
      if (abs >= 100) return n.toFixed(1);
      return n.toFixed(2);
    }

    function setChartStatus(msg) {
      const el = document.getElementById("chartStatus");
      if (!msg) {
        el.classList.remove("show");
        el.textContent = "";
        return;
      }
      el.textContent = msg;
      el.classList.add("show");
    }

    function resetPeriodValues() {
      document.querySelectorAll("[data-period-value]").forEach((el) => {
        el.textContent = "--";
        el.className = "value";
      });
      document.querySelectorAll(".chart-period").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.chartRange === "day");
      });
    }

    function renderPeriodReturns(returns) {
      Object.entries(returns || {}).forEach(([key, value]) => {
        const el = document.querySelector(`[data-period-value="${key}"]`);
        if (!el) return;
        if (value == null || Number.isNaN(value)) {
          el.textContent = "--";
          el.className = "value";
          return;
        }
        el.textContent = formatPct(value);
        el.className = "value " + toneClass(value);
      });
    }

    function buildRangeSeries(range, state) {
      if (range === "day") {
        if (!state.trend) return null;
        return {
          title: "当日分时",
          baseline: state.trend.preClose,
          baselineLabel: "昨收",
          points: state.trend.points.map((p) => ({
            label: p.time,
            price: p.price,
            avg: p.avg,
            volume: p.volume
          })),
          showAvg: true
        };
      }

      if (!state.history?.klines?.length) return null;
      const sliced = sliceKlinesForRange(state.history.klines, range);
      if (sliced.length < 2) return null;

      const labels = {
        "1m": "近1月",
        "3m": "近3月",
        "6m": "近半年",
        ytd: "今年以来",
        "1y": "近1年"
      };

      return {
        title: labels[range] || "走势",
        baseline: sliced[0].close,
        baselineLabel: "起点",
        points: sliced.map((k) => ({
          label: k.date.slice(5),
          price: k.close,
          avg: null,
          volume: k.volume
        })),
        showAvg: false
      };
    }

    function drawIntradayChart(canvas, series) {
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || 320;
      const cssH = canvas.clientHeight || 280;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);

      const points = series.points;
      if (!points?.length) return;

      const pad = { top: 16, right: 14, bottom: 56, left: 52 };
      const volH = 48;
      const plotW = cssW - pad.left - pad.right;
      const plotH = cssH - pad.top - pad.bottom - volH - 10;
      const volTop = pad.top + plotH + 10;

      const prices = points.map((p) => p.price);
      let minP = Math.min(...prices);
      let maxP = Math.max(...prices);
      if (series.baseline != null) {
        minP = Math.min(minP, series.baseline);
        maxP = Math.max(maxP, series.baseline);
      }
      const span = maxP - minP || Math.abs(maxP) * 0.01 || 1;
      minP -= span * 0.08;
      maxP += span * 0.08;

      const maxVol = Math.max(...points.map((p) => p.volume || 0), 1);
      const last = points[points.length - 1];
      const lineColor =
        series.baseline == null
          ? "#1677ff"
          : last.price >= series.baseline
            ? "#e64545"
            : "#12a150";

      function xAt(i) {
        if (points.length === 1) return pad.left + plotW / 2;
        return pad.left + (i / (points.length - 1)) * plotW;
      }

      function yAt(price) {
        return pad.top + ((maxP - price) / (maxP - minP)) * plotH;
      }

      ctx.strokeStyle = "#edf0f5";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad.top + (plotH * i) / 4;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + plotW, y);
        ctx.stroke();
      }

      if (series.baseline != null) {
        const y = yAt(series.baseline);
        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "#94a3b8";
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + plotW, y);
        ctx.stroke();
        ctx.restore();
      }

      ctx.beginPath();
      points.forEach((p, i) => {
        const x = xAt(i);
        const y = yAt(p.price);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      const lastX = xAt(points.length - 1);
      ctx.lineTo(lastX, pad.top + plotH);
      ctx.lineTo(xAt(0), pad.top + plotH);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
      grad.addColorStop(0, lineColor + "33");
      grad.addColorStop(1, lineColor + "00");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      points.forEach((p, i) => {
        const x = xAt(i);
        const y = yAt(p.price);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = "round";
      ctx.stroke();

      if (series.showAvg) {
        let started = false;
        ctx.beginPath();
        points.forEach((p, i) => {
          if (p.avg == null) return;
          const x = xAt(i);
          const y = yAt(p.avg);
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        });
        if (started) {
          ctx.strokeStyle = "#f59e0b";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      const barW = Math.max(1, plotW / points.length - 0.5);
      points.forEach((p, i) => {
        const h = ((p.volume || 0) / maxVol) * volH;
        const x = xAt(i) - barW / 2;
        const y = volTop + volH - h;
        const up =
          i === 0
            ? series.baseline == null || p.price >= series.baseline
            : p.price >= points[i - 1].price;
        ctx.fillStyle = up ? "rgba(230, 69, 69, 0.35)" : "rgba(18, 161, 80, 0.35)";
        ctx.fillRect(x, y, barW, h);
      });

      ctx.fillStyle = "#8a8f98";
      ctx.font = '11px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 4; i++) {
        const price = maxP - ((maxP - minP) * i) / 4;
        const y = pad.top + (plotH * i) / 4;
        ctx.fillText(formatPrice(price), pad.left - 8, y);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const timeIdx = [0, Math.floor((points.length - 1) / 2), points.length - 1];
      timeIdx.forEach((i) => {
        ctx.fillText(points[i].label, xAt(i), cssH - 18);
      });

      ctx.textAlign = "left";
      ctx.fillText("成交量", pad.left, volTop - 2);
    }

    function updateChartMeta(series, state) {
      const last = series.points[series.points.length - 1];
      const base = series.baseline;
      const chg = base ? ((last.price - base) / base) * 100 : null;
      const tone = chg == null ? "flat" : toneClass(chg);

      const priceEl = document.getElementById("chartModalPrice");
      const chgEl = document.getElementById("chartModalChg");
      priceEl.textContent = formatPrice(last.price);
      priceEl.className = "price " + tone;

      if (chg == null) {
        chgEl.textContent = "--";
        chgEl.className = "chg flat";
      } else {
        chgEl.textContent = formatPct(chg);
        chgEl.className = "chg " + tone;
      }

      const name = state.trend?.name || state.history?.name || "";
      const code = state.trend?.code || state.history?.code || "";
      document.getElementById("chartModalName").textContent =
        name + (code ? `（${code}）` : "");
      document.getElementById("chartModalSub").textContent =
        `${series.title} · ${series.baselineLabel || "基准"} ${formatPrice(base)}`;
    }

    function renderActiveChart() {
      const state = openChartModal._state;
      if (!state) return;
      const series = buildRangeSeries(state.range, state);
      const canvas = document.getElementById("chartCanvas");
      if (!series) {
        setChartStatus(state.range === "day" ? "暂无当日分时数据" : "暂无该区间行情");
        return;
      }
      openChartModal._lastSeries = series;
      setChartStatus("");
      updateChartMeta(series, state);
      drawIntradayChart(canvas, series);
    }

    function setChartRange(range) {
      const state = openChartModal._state;
      if (!state) return;
      state.range = range;
      document.querySelectorAll(".chart-period").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.chartRange === range);
      });
      renderActiveChart();
    }

    let chartRequestId = 0;

    async function openChartModal(fundId, index) {
      const fund = window.FUND_HOLDINGS[fundId];
      const holding = fund?.holdings?.[index];
      if (!holding) return;

      const modal = document.getElementById("chartModal");
      const canvas = document.getElementById("chartCanvas");
      const reqId = ++chartRequestId;

      document.getElementById("chartModalName").textContent =
        holding.name + "（" + holding.code + "）";
      document.getElementById("chartModalSub").textContent = "加载行情中…";
      document.getElementById("chartModalPrice").textContent = "--";
      document.getElementById("chartModalPrice").className = "price flat";
      document.getElementById("chartModalChg").textContent = "--";
      document.getElementById("chartModalChg").className = "chg flat";
      resetPeriodValues();
      canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);

      openChartModal._state = { range: "day", trend: null, history: null, returns: null };
      openChartModal._lastSeries = null;

      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setChartStatus("加载分时与区间涨跌幅…");

      const [trendResult, historyResult] = await Promise.allSettled([
        loadIntradayTrends(holding),
        loadDailyKlines(holding)
      ]);

      if (reqId !== chartRequestId) return;

      const state = {
        range: "day",
        trend: trendResult.status === "fulfilled" ? trendResult.value : null,
        history: historyResult.status === "fulfilled" ? historyResult.value : null,
        returns: null
      };

      if (state.history) {
        state.returns = calcPeriodReturns(state.history.klines);
      } else {
        state.returns = { day: null, "1m": null, "3m": null, "6m": null, ytd: null, "1y": null };
      }

      if (state.trend?.preClose != null && state.trend.points?.length) {
        const last = state.trend.points[state.trend.points.length - 1];
        state.returns.day =
          Math.round(((last.price - state.trend.preClose) / state.trend.preClose) * 10000) / 100;
      }
      renderPeriodReturns(state.returns);

      openChartModal._state = state;

      if (!state.trend && !state.history) {
        openChartModal._lastSeries = null;
        setChartStatus("行情加载失败，请稍后重试");
        return;
      }

      if (!state.trend && state.history) {
        state.range = "1m";
        document.querySelectorAll(".chart-period").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.chartRange === "1m");
        });
      }

      renderActiveChart();
    }

    function closeChartModal() {
      chartRequestId += 1;
      openChartModal._state = null;
      openChartModal._lastSeries = null;
      const modal = document.getElementById("chartModal");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      setChartStatus("");
      resetPeriodValues();
    }

    async function syncFundQuotes(fundId) {
      const fund = window.FUND_HOLDINGS[fundId];
      const btn = document.querySelector(`[data-sync="${fundId}"]`);

      const label = btn.querySelector(".btn-sync-label");
      btn.disabled = true;
      btn.classList.add("loading");
      if (label) label.textContent = "正在抓取…";

      try {
        const quotes = await loadQuotes(fund.holdings);
        let ok = 0;
        const failed = [];

        fund.holdings.forEach((h, i) => {
          const quote = quotes[h.code] || quotes[quoteKey(h.code)];
          const input = document.querySelector(`input[data-fund="${fundId}"][data-index="${i}"]`);
          const preEl = document.querySelector(
            `[data-pre-change][data-fund="${fundId}"][data-index="${i}"]`
          );
          if (preEl) applyPreChangeDisplay(preEl, quote?.preChange);

          if (!quote || !input || Number.isNaN(quote.change)) {
            failed.push(h.name);
            return;
          }
          input.value = quote.change.toFixed(2);
          applyChangeColor(input);
          ok += 1;
        });

        persistFromDom();

        if (ok === 0) {
          showToast("未获取到行情，请稍后重试");
          return;
        }

        showToast(
          failed.length
            ? `已同步 ${ok} 只，失败：${failed.join("、")}`
            : `已同步 ${ok} 只股票实时涨跌幅`
        );
      } catch (err) {
        showToast(err.message || "同步失败");
      } finally {
        btn.disabled = false;
        btn.classList.remove("loading");
        if (label) label.textContent = "推送实时涨跌幅";
      }
    }

    function render() {
      const saved = loadInputs();
      const panels = document.getElementById("panels");
      panels.innerHTML = "";

      Object.values(window.FUND_HOLDINGS).forEach((fund, index) => {
        const panel = document.createElement("section");
        panel.className = "panel" + (index === 0 ? " active" : "");
        panel.dataset.panel = fund.id;

        const fundSaved = saved[fund.id] || {};

        const isUS = fund.market === "US" || fund.viewOnly;
        const viewOnly = !!fund.viewOnly;
        const ratioLabel = isUS ? "参考权重" : "持仓比例";
        const metaSub = isUS
          ? `共 ${fund.holdings.length} 只主流半导体 · 仅查看涨跌`
          : `代码 ${fund.fundCode} · 前十大合计 ${fund.top10Total.toFixed(2)}%`;
        const gridClass = viewOnly ? "row view-only" : "row";
        const headClass = viewOnly ? "list-head view-only" : "list-head";

        const actionsHtml = viewOnly
          ? `
          <div class="actions">
            <button class="btn btn-ghost" type="button" data-clear="${fund.id}">清空输入</button>
          </div>`
          : `
          <div class="actions">
            <button class="btn btn-primary" type="button" data-calc="${fund.id}">计算每日基金收益</button>
            <button class="btn btn-ghost" type="button" data-clear="${fund.id}">清空输入</button>
          </div>

          <div class="result" id="result-${fund.id}">
            <div class="label">估算当日收益</div>
            <div class="value flat" id="value-${fund.id}">--</div>
            <div class="detail" id="detail-${fund.id}"></div>
          </div>`;

        panel.innerHTML = `
          <div class="fund-card">
            <div class="fund-meta">
              <div class="fund-meta-text">
                <div class="name">${fund.fundName}</div>
                <div class="sub">${metaSub}</div>
              </div>
              <button class="btn btn-sync" type="button" data-sync="${fund.id}">
                <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <path d="M13.65 2.35A7.96 7.96 0 0 0 8 0C3.58 0 0 3.58 0 8s3.58 8 8 8a7.96 7.96 0 0 0 5.65-2.35l-1.41-1.41A5.98 5.98 0 0 1 8 14a6 6 0 1 1 5.65-8.65L11 8h5V3l-2.35-.65z"/>
                </svg>
                <span class="btn-sync-label">推送实时涨跌幅</span>
              </button>
            </div>
            <div class="${headClass}">
              <div>股票名称</div>
              ${viewOnly ? "" : `<div>${ratioLabel}</div>`}
              <div>盘前%</div>
              <div>日涨跌幅%</div>
            </div>
            <div class="list-body">
              ${fund.holdings.map((h, i) => `
                <div class="${gridClass}" data-index="${i}">
                  <div
                    class="stock-name"
                    role="button"
                    tabindex="0"
                    data-chart-fund="${fund.id}"
                    data-chart-index="${i}"
                    title="查看 ${h.name} 当日分时"
                  >${h.name}（${h.code}）</div>
                  ${viewOnly ? "" : `<div class="ratio">${h.ratio.toFixed(2)}%</div>`}
                  <div class="pre-change" data-pre-change data-fund="${fund.id}" data-index="${i}">--</div>
                  <div class="change-field">
                    <input
                      type="number"
                      step="0.01"
                      inputmode="decimal"
                      placeholder="如 1.25"
                      data-fund="${fund.id}"
                      data-index="${i}"
                      value="${fundSaved[i] ?? ""}"
                    />
                    <span class="change-icon up-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 3.2 13.2 11H2.8L8 3.2z"/>
                      </svg>
                    </span>
                    <span class="change-icon down-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 12.8 2.8 5h10.4L8 12.8z"/>
                      </svg>
                    </span>
                  </div>
                </div>
              `).join("")}
            </div>
            ${buildPagerHtml(fund)}
          </div>

          ${actionsHtml}
        `;

        panels.appendChild(panel);
        setCurrentPage(fund.id, getCurrentPage(fund.id));
        applyPage(fund.id);
      });

      applyAllChangeColors();
    }

    function persistFromDom() {
      const saved = loadInputs();
      document.querySelectorAll("input[data-fund]").forEach((input) => {
        const fundId = input.dataset.fund;
        const index = input.dataset.index;
        if (!saved[fundId]) saved[fundId] = {};
        saved[fundId][index] = input.value === "" ? "" : input.value;
      });
      saveInputs(saved);
    }

    function calcFund(fundId) {
      const fund = window.FUND_HOLDINGS[fundId];
      if (fund.viewOnly) return;
      const inputs = document.querySelectorAll(`input[data-fund="${fundId}"]`);
      let weighted = 0;
      let filledWeight = 0;
      let filledCount = 0;
      let missing = [];

      fund.holdings.forEach((h, i) => {
        const raw = inputs[i].value.trim();
        if (raw === "" || Number.isNaN(Number(raw))) {
          missing.push(h.name);
          return;
        }
        const change = Number(raw);
        weighted += h.ratio * change;
        filledWeight += h.ratio;
        filledCount += 1;
      });

      const estimate = weighted / 100;
      const resultEl = document.getElementById(`result-${fundId}`);
      const valueEl = document.getElementById(`value-${fundId}`);
      const detailEl = document.getElementById(`detail-${fundId}`);

      resultEl.classList.add("show");
      valueEl.textContent = formatPct(estimate);
      valueEl.className = "value " + (estimate > 0 ? "up" : estimate < 0 ? "down" : "flat");

      const coverLabel = fund.market === "US" ? "等权合计" : "前十大合计";
      const parts = [
        `已填写 ${filledCount}/${fund.holdings.length} 只，覆盖权重 ${filledWeight.toFixed(2)}%（${coverLabel} ${fund.top10Total.toFixed(2)}%）。`
      ];
      if (missing.length) {
        parts.push(`未填写：${missing.join("、")}（按 0 处理）。`);
      }
      detailEl.textContent = parts.join(" ");
      persistFromDom();
    }

    function clearFund(fundId) {
      document.querySelectorAll(`input[data-fund="${fundId}"]`).forEach((input) => {
        input.value = "";
        applyChangeColor(input);
      });
      document
        .querySelectorAll(`[data-pre-change][data-fund="${fundId}"]`)
        .forEach((el) => applyPreChangeDisplay(el, null));
      const resultEl = document.getElementById(`result-${fundId}`);
      if (resultEl) resultEl.classList.remove("show");
      persistFromDom();
    }

    function getTabButtons() {
      return Array.from(document.querySelectorAll(".tabs .tab"));
    }

    function updateTabArrows() {
      const tabs = getTabButtons();
      const index = tabs.findIndex((t) => t.classList.contains("active"));
      const prevBtn = document.querySelector("[data-tab-prev]");
      const nextBtn = document.querySelector("[data-tab-next]");
      if (prevBtn) prevBtn.disabled = index <= 0;
      if (nextBtn) nextBtn.disabled = index < 0 || index >= tabs.length - 1;
    }

    function switchTab(fundId, { forceSync = false } = {}) {
      const tabs = getTabButtons();
      const tab = tabs.find((t) => t.dataset.tab === fundId);
      if (!tab) return;

      const alreadyActive = tab.classList.contains("active");
      tabs.forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      tab.classList.add("active");

      const panel = document.querySelector(`[data-panel="${fundId}"]`);
      if (panel) panel.classList.add("active");

      tab.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      updateTabArrows();

      if (!alreadyActive || forceSync) {
        syncFundQuotes(fundId);
      }
    }

    function shiftTab(step) {
      const tabs = getTabButtons();
      const index = tabs.findIndex((t) => t.classList.contains("active"));
      const next = tabs[index + step];
      if (next) switchTab(next.dataset.tab);
    }

    document.addEventListener("click", (e) => {
      if (e.target.closest("[data-chart-close]")) {
        closeChartModal();
        return;
      }

      const rangeBtn = e.target.closest("[data-chart-range]");
      if (rangeBtn) {
        setChartRange(rangeBtn.dataset.chartRange);
        return;
      }

      const chartName = e.target.closest("[data-chart-fund]");
      if (chartName) {
        openChartModal(chartName.dataset.chartFund, Number(chartName.dataset.chartIndex));
        return;
      }

      const pagePrev = e.target.closest("[data-page-prev]");
      if (pagePrev) {
        const fundId = pagePrev.dataset.pagePrev;
        setCurrentPage(fundId, getCurrentPage(fundId) - 1);
        applyPage(fundId);
        return;
      }

      const pageNext = e.target.closest("[data-page-next]");
      if (pageNext) {
        const fundId = pageNext.dataset.pageNext;
        setCurrentPage(fundId, getCurrentPage(fundId) + 1);
        applyPage(fundId);
        return;
      }

      const pageNum = e.target.closest("[data-page-num]");
      if (pageNum) {
        const fundId = pageNum.dataset.fundPage;
        setCurrentPage(fundId, Number(pageNum.dataset.pageNum));
        applyPage(fundId);
        return;
      }

      if (e.target.closest("[data-tab-prev]")) {
        shiftTab(-1);
        return;
      }

      if (e.target.closest("[data-tab-next]")) {
        shiftTab(1);
        return;
      }

      const tab = e.target.closest(".tab");
      if (tab) {
        switchTab(tab.dataset.tab);
        return;
      }

      const syncBtn = e.target.closest("[data-sync]");
      if (syncBtn) {
        syncFundQuotes(syncBtn.dataset.sync);
        return;
      }

      const calcBtn = e.target.closest("[data-calc]");
      if (calcBtn) {
        calcFund(calcBtn.dataset.calc);
        return;
      }

      const clearBtn = e.target.closest("[data-clear]");
      if (clearBtn) {
        clearFund(clearBtn.dataset.clear);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const modal = document.getElementById("chartModal");
        if (modal.classList.contains("show")) closeChartModal();
        return;
      }

      const chartName = e.target.closest?.("[data-chart-fund]");
      if (chartName && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        openChartModal(chartName.dataset.chartFund, Number(chartName.dataset.chartIndex));
      }
    });

    window.addEventListener("resize", () => {
      const modal = document.getElementById("chartModal");
      if (!modal.classList.contains("show") || !openChartModal._lastSeries) return;
      drawIntradayChart(document.getElementById("chartCanvas"), openChartModal._lastSeries);
    });

    document.addEventListener("input", (e) => {
      if (e.target.matches("input[data-fund]")) {
        applyChangeColor(e.target);
        persistFromDom();
      }
    });

    render();
    updateTabArrows();
  </script>
</body>
</html>
