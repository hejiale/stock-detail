<div class="chart-modal" id="chartModal" aria-hidden="true">
    <div class="chart-modal-backdrop" data-chart-close></div>
    <div class="chart-modal-panel" role="dialog" aria-modal="true" aria-labelledby="chartModalName">
      <div class="chart-modal-head">
        <div class="chart-modal-head-top">
          <div class="chart-modal-title">
            <button class="chart-name-btn" type="button" id="chartModalNameBtn" data-open-profile title="查看个股资料">
              <span class="name" id="chartModalName">--</span>
              <svg class="chart-name-arrow" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M5.8 2.6 4.6 3.8 8.8 8l-4.2 4.2 1.2 1.2L11.2 8 5.8 2.6z"/>
              </svg>
            </button>
            <div class="chart-name-code" id="chartModalCode" hidden></div>
            <div class="chart-quote-summary">
              <span class="price flat" id="chartModalPrice">--</span>
              <span class="chart-quote-chg">
                <span class="chg-amt flat" id="chartModalChgAmt">--</span>
                <span class="chg flat" id="chartModalChg">--</span>
                <span class="chg-arrow-host" id="chartModalChgArrow" aria-hidden="true"></span>
              </span>
            </div>
          </div>
          <div class="chart-modal-actions">
            <button class="chart-modal-close" type="button" data-chart-close aria-label="关闭">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M3.5 2.4 8 6.9l4.5-4.5 1.1 1.1L9.1 8l4.5 4.5-1.1 1.1L8 9.1l-4.5 4.5-1.1-1.1L6.9 8 2.4 3.5l1.1-1.1z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="chart-quote-grid" id="chartQuoteGrid" hidden></div>
      </div>
      <div class="chart-periods" id="chartPeriods">
        <button class="chart-period active" type="button" data-chart-range="day">
          <span class="label">当日</span>
          <span class="value" data-period-value="day">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="1m">
          <span class="label">近1月</span>
          <span class="value" data-period-value="1m">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="3m">
          <span class="label">近3月</span>
          <span class="value" data-period-value="3m">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="6m">
          <span class="label">近半年</span>
          <span class="value" data-period-value="6m">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="ytd">
          <span class="label">今年以来</span>
          <span class="value" data-period-value="ytd">--</span>
        </button>
        <button class="chart-period" type="button" data-chart-range="1y">
          <span class="label">近1年</span>
          <span class="value" data-period-value="1y">--</span>
        </button>
      </div>
      <div class="chart-modal-body">
        <div class="chart-quant-bar" id="chartQuantBar" hidden></div>
        <div class="chart-legend" id="chartLegend" hidden></div>
        <div class="chart-canvas-wrap">
          <canvas id="chartCanvas"></canvas>
          <div class="chart-crosshair-tip" id="chartCrosshairTip" hidden>
            <span class="t-time"></span>
            <span class="t-price"></span>
            <span class="t-pct"></span>
          </div>
        </div>
        <div class="chart-status" id="chartStatus">加载中…</div>
      </div>
    </div>
  </div>
